services:
  - type: web
    name: second-brain
    runtime: python
    buildCommand: pip install -r backend/requirements-minimal.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/opennotebook.db
      - key: DB_PATH
        value: ./data/opennotebook.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SENTENCE_TRANSFORMERS_HOME
        value: ./models
      - key: HF_HOME
        value: ./models
      - key: YT_WHISPER_CACHE_DIR
        value: ./models/whisper
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMB_MODEL_NAME
        value: text-embedding-3-small
      - key: EMB_DIMENSION
        value: "1536"
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_USER
        value: "false"
